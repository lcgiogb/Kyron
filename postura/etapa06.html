<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Etapa 6 - Gamificação Final (MVP)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    body { margin: 0; overflow: hidden; font-family: 'Orbitron', sans-serif; background: #050510; color: white;}
    #videoElement { display: none; }
    #outputCanvas { position: absolute; width: 100vw; height: 100vh; z-index: 1; }
    
    .hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,20,30,0.8); padding: 20px; border: 1px solid cyan; border-radius: 10px; }
    button { background: rgba(0, 255, 255, 0.2); color: cyan; border: 1px solid cyan; padding: 10px; cursor: pointer; margin-bottom: 15px;}
    button:hover { background: cyan; color: black; }
    
    .hp-container { width: 300px; height: 20px; border: 1px solid white; border-radius: 10px; margin-top: 10px; overflow: hidden; }
    #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #0f0); transition: width 0.2s linear; }
    #txtGameOver { color: red; font-size: 24px; text-shadow: 0 0 10px red; display: none; margin-top: 10px;}
  </style>
</head>
<body>
  
  <video id="videoElement" autoplay playsinline></video>
  <canvas id="outputCanvas"></canvas>

  <div class="hud">
    <h2>CyberPosture</h2>
    <button id="btnCalibrar">🎯 Calibrar Postura Ideal</button>
    
    <div style="margin-top: 10px;">HP Ergonomia: <span id="txtHp">100</span>%</div>
    <div class="hp-container">
      <div id="hp-bar"></div>
    </div>
    <div id="txtGameOver">GAME OVER: ALONGUE-SE!</div>
  </div>

  <script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    let isCalibrated = false; let requestCalibration = false; let baselineNeckLength = 0;
    let skeletonColor = '#00ffff';
    let hp = 100; // Pontos de Vida
    let gameOver = false;

    document.getElementById('btnCalibrar').addEventListener('click', () => { requestCalibration = true; gameOver = false; document.getElementById('txtGameOver').style.display = 'none'; });

    function calculateDistance(p1, p2) { return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2)); }
    function getMidpoint(p1, p2) { return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }; }

    function onResults(results) {
      canvasElement.width = window.innerWidth; canvasElement.height = window.innerHeight;
      canvasCtx.save(); canvasCtx.translate(canvasElement.width, 0); canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const pLEar = { x: results.poseLandmarks[7].x * canvasElement.width, y: results.poseLandmarks[7].y * canvasElement.height };
        const pREar = { x: results.poseLandmarks[8].x * canvasElement.width, y: results.poseLandmarks[8].y * canvasElement.height };
        const pLShoulder = { x: results.poseLandmarks[11].x * canvasElement.width, y: results.poseLandmarks[11].y * canvasElement.height };
        const pRShoulder = { x: results.poseLandmarks[12].x * canvasElement.width, y: results.poseLandmarks[12].y * canvasElement.height };
        
        const currentNeckLength = calculateDistance(getMidpoint(pLEar, pREar), getMidpoint(pLShoulder, pRShoulder));

        if (requestCalibration) { baselineNeckLength = currentNeckLength; isCalibrated = true; requestCalibration = false; hp = 100;}

        if (isCalibrated && !gameOver) {
            const neckRatio = currentNeckLength / baselineNeckLength;
            
            // --- LÓGICA DE GAMIFICAÇÃO (Dano no HP) ---
            if (neckRatio < 0.85) { 
                skeletonColor = '#ff0000'; 
                hp -= 0.5; // Dano alto
            } else if (neckRatio < 0.92) {
                skeletonColor = '#ffff00'; 
                hp -= 0.2; // Dano baixo
            } else {
                skeletonColor = '#00ff00'; 
                hp += 0.3; // Cura
            }
            
            // Limitar HP entre 0 e 100
            hp = Math.max(0, Math.min(100, hp));
            
            // Atualiza Interface Visual (Barra de Vida)
            document.getElementById('hp-bar').style.width = hp + '%';
            document.getElementById('txtHp').innerText = Math.round(hp);

            // Regra do Game Over
            if (hp <= 0) {
                gameOver = true;
                document.getElementById('txtGameOver').style.display = 'block';
            }
        }

        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: skeletonColor, lineWidth: 4});
      }
      canvasCtx.restore();
    }
    const pose = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
    pose.onResults(onResults);
    new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 1280, height: 720 }).start();
  </script>
</body>
</html>
