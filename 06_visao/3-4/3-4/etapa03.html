<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Etapa 3 - Desenhando o Esqueleto</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <!-- Ferramentas de desenho prontas do MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <style>
    #videoElement { display: none; }
    canvas { border: 2px solid black; }
  </style>
</head>
<body>
  <h1>Etapa 3: Extraindo e Desenhando o Esqueleto</h1>
  <video id="videoElement" autoplay playsinline></video>
  <canvas id="outputCanvas" width="640" height="480"></canvas>

  <script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // Se a IA encontrou um corpo na imagem...
      if (results.poseLandmarks) {
        // Desenhamos as linhas (ossos) conectando os pontos
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {
          color: '#00FF00', // Linhas verdes
          lineWidth: 4
        });
        
        // Desenhamos os pontos (juntas)
        drawLandmarks(canvasCtx, results.poseLandmarks, {
          color: '#FF0000', // Pontos vermelhos
          lineWidth: 2, 
          radius: 4
        });
      }
      
      canvasCtx.restore();
    }

    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({image: videoElement}); },
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
